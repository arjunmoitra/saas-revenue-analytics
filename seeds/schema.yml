version: 2

seeds:
  - name: country_codes
    description: >
      Lookup used by stg_customers to normalise the free-text country values in
      the source system to ISO 3166-1 alpha-2 codes. `raw_value` is matched on
      the lower-cased, trimmed source value.
    config:
      column_types:
        raw_value: varchar
        country_code: varchar
        country_name: varchar
    columns:
      - name: raw_value
        tests: [unique, not_null]
      - name: country_code
        tests: [not_null]
